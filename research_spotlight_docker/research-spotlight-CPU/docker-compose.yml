services:
  research-spotlight:
    build: .
    image: research-spotlight:latest

    ports:
      - "8080:8000"

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - research-spotlight-cache:/root/.cache
      - research-spotlight-hf:/cache/huggingface

    restart: unless-stopped


volumes:
  research-spotlight-cache:
  research-spotlight-hf:
