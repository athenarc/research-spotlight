services:
  research-spotlight:
    build: .
    image: research-spotlight:latest

    ports:
      - "127.0.0.1:8080:8000"

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - research-spotlight-cache:/root/.cache
      - research-spotlight-hf:/cache/huggingface

    restart: unless-stopped

    # NVIDIA GPU is required: needs the NVIDIA Container Toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]


volumes:
  research-spotlight-cache:
  research-spotlight-hf:
